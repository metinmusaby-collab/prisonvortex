# ================================
#   OptimTowny Yapılandırma Dosyası
# ================================

genel:
  maksimum-kasaba-sayisi: 10          # Sunucuda kurulabilecek toplam kasaba limiti
  kasaba-kurma-fiyati: 500.0
  kasaba-basina-max-oyuncu: 20
  kasaba-basina-max-chunk: 36
  chunk-fiyati: 50.0
  varsayilan-para: 200.0

ulus:
  ulus-kurma-fiyati: 2000.0
  min-kasaba-uye-sayisi-ulus-icin: 1
  ulus-basina-max-kasaba: 10

vergi:
  aktif: true
  # Vergi toplama periyodu (dakika)
  toplama-araligi-dakika: 60
  oyuncu-basi-vergi: 10.0
  kasaba-ulus-vergisi: 25.0
  odenmeyen-vergi-limiti: 3          # Bu sayıya ulaşınca oyuncu kasabadan atılır
  ilan-mesaji-goster: true

rutbeler:
  siralama:
    - "Kurucu"
    - "Yönetici"
    - "Asker"
    - "Üye"
    - "Aday"
  varsayilan-rutbe: "Aday"
  # Rütbe atlamak için gereken görev tamamlama sayısı
  atlama-icin-gereken-gorev: 3

savas:
  aktif: true
  # 24 saatlik format, savaş modunun otomatik açılacağı saatler (sunucu saati)
  savas-saatleri:
    - "20:00-21:00"
    - "13:00-13:30"
  savas-disinda-pvp: false
  kasaba-ele-gecirme-aktif: true
  ele-gecirme-icin-gereken-hasar-yuzdesi: 60

boss:
  aktif: true
  savas-modunda-otomatik-spawn: true
  spawn-sansi-yuzde: 35
  boss-can: 400.0
  boss-hasar: 12.0
  boss-adi: "&4&lKasaba Muhafızı"
  odul-para: 750.0

gorevler:
  gunluk-gorev-sayisi: 3
  odul-carpani: 1.0

harita:
  genislik: 21
  yukseklik: 21
  kendi-kasaba-rengi: "&a"
  dost-kasaba-rengi: "&b"
  dusman-kasaba-rengi: "&c"
  bos-alan-rengi: "&7"

dil:
  prefix: "&8[&6OptimTowny&8] &r"
