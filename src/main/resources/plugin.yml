name: OptimTowny
version: '1.0.0'
main: com.optim.towny.OptimTowny
api-version: '1.21'
author: Sen
description: Kasaba, ulus, savaş, rütbe, vergi, banka, görev ve boss sistemli optimize Towny eklentisi.

commands:
  kasaba:
    description: Kasaba yönetim komutu
    usage: /kasaba <kur|katil|ayril|bilgi|liste|davet|kov|rutbe|para>
    aliases: [town, k]
  ulus:
    description: Ulus yönetim komutu
    usage: /ulus <kur|ekle|cikar|bilgi|liste|para>
    aliases: [nation, u]
  harita:
    description: Bölgedeki kasabaların haritasını gösterir
    usage: /harita
    aliases: [map, harita]
  savas:
    description: Savaş modu bilgisini ve saatlerini gösterir
    usage: /savas <bilgi|baslat|bitir>
    aliases: [war]
  gorev:
    description: Görev (quest) sistemi komutu
    usage: /gorev <liste|al|birak|ilerleme>
    aliases: [quest, gorevler]
  vergi:
    description: Vergi sistemi bilgisi
    usage: /vergi <bilgi|topla>
    aliases: [tax]

permissions:
  optimtowny.admin:
    description: Tüm yönetici komutlarına erişim
    default: op
  optimtowny.kurucu:
    description: Kasaba/ulus kurabilme
    default: true
