name: OptimTowny Derle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu çek
        uses: actions/checkout@v4

      - name: JDK 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Maven ile derle
        run: mvn -B clean package

      - name: Derlenen jar dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OptimTowny-jar
          path: target/OptimTowny.jar
